<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: transparent;
    padding: 0;
    margin: 0;
    display: inline-block;
  }
  .panel {
    background: #181818;
    border: 1px solid #333333;
    border-radius: 6px;
    overflow: hidden;
    margin: 8px;
    display: inline-block;
  }
  .panel-header {
    background: #252526;
    padding: 8px 16px;
    font-family: sans-serif;
    font-size: 12px;
    color: #9cdcfe;
    font-weight: 600;
  }
  table {
    border-collapse: collapse;
    font-family: monospace;
    font-size: 12px;
  }
  th { background: #1f1f1f; color: #4ec9b0; padding: 6px 14px; border-bottom: 2px solid #383838; }
  td { padding: 5px 14px; border-bottom: 1px solid #262626; color: #cccccc; }
</style>
</head>
<body>
<div class='panel'>
  <div class='panel-header'>Test Title</div>
  <table>
    <thead><tr><th>col1</th><th>col2</th></tr></thead>
    <tbody>
      <tr><td>val1</td><td>val2</td></tr>
      <tr><td>val3</td><td>val4</td></tr>
    </tbody>
  </table>
</div>
</body>
</html>
